<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>✊ Rock Paper Scissors ✌️</h1>
  <p class="subtitle">Choose your move:</p>

  <div class="buttons">
    <button id="rock" class="choice-btn">🪨 Rock</button>
    <button id="paper" class="choice-btn">📄 Paper</button>
    <button id="scissors" class="choice-btn">✂️ Scissors</button>
  </div>

  <div class="scoreboard">
    <span>You: <span id="user-score">0</span></span>
    <span class="vs">vs</span>
    <span>Computer: <span id="computer-score">0</span></span>
  </div>

  <p id="result">✨ Make your move!</p>
  <p id="winner-message"></p>

  <button id="reset-btn" class="reset-btn">🔄 New Game</button>

  <script src="index.js"></script>
</body>
</html>
